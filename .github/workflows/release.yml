# Fabrique l'installateur Windows et le publie.
#
# L'installateur ne peut pas être produit ailleurs que sous Windows : sqlite3
# est une bibliothèque native, et `npm ci` n'y télécharge le binaire du système
# courant. Cette machine virtuelle évite donc d'avoir à posséder un PC Windows.
#
# Déclenchement : poser une étiquette de version, par exemple
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# ou lancer le workflow à la main depuis l'onglet Actions.
name: Installateur Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Nécessaire pour créer la publication et y déposer le fichier.
permissions:
  contents: write

jobs:
  installateur:
    name: Compiler et publier le .exe
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # C'est cette étape, exécutée sous Windows, qui récupère le binaire
      # sqlite3 correspondant.
      - name: Installer les dépendances du serveur
        run: npm ci

      - name: Installer les dépendances de l'interface
        working-directory: client
        run: npm ci

      - name: Compiler l'interface et l'installateur
        run: npm run build

      # Permet de récupérer le fichier même sur un lancement manuel, où aucune
      # publication n'est créée.
      - name: Conserver l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: Clora-Installateur
          path: dist/*.exe
          if-no-files-found: error

      # Le nom produit par electron-builder porte la version
      # (Clora-Installateur-1.2.0.exe), ce qui rend mort à chaque publication
      # tout lien direct posé sur un site web. On dépose donc aussi une copie
      # sous un nom fixe : GitHub sert alors en permanence
      # /releases/latest/download/Clora-Installateur.exe, et le bouton de
      # téléchargement n'a plus jamais à être modifié.
      #
      # Le fichier versionné reste publié : au support, savoir quelle version
      # le client a réellement installée vaut la peine des deux actifs.
      - name: Nommer une copie stable pour le lien du site web
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist/Clora-Installateur.exe

      - name: Publier
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
